entities:
- name: Brand
  id_field: brandRef
  description: The configuration of a partner within BaseKit; a secure data partition. Users belong to exactly one brand.
- name: User
  id_field: userRef
  aka:
  - Account Holder
  description: An individual account created within a brand; holds exactly one package at a time.
- name: Package
  description: >-
    Defines the features available to a user (site limits, template access, storage). Types
    include Suspension (default), Trial, Freemium and Premium.
- name: Site
  id_field: siteRef
  description: An individual website created by a user; users may create multiple sites subject to package publishing limits.
- name: Domain
  id_field: domainRef
  description: A custom domain mapped to a site. Sites also receive an automatic subdomain (subdomain.brand.com).
- name: BillingCycle
  description: Subscription payment frequency in months (1 monthly, 12 annual).
relationships:
- from: User
  to: Brand
  type: belongs_to
