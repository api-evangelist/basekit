aid: basekit
name: Basekit
description: >-
  BaseKit is a white-label SaaS platform that lets partners — web hosting companies, telcos,
  banks, SaaS providers and resellers — offer website building, online stores and bookings to
  small businesses under their own brand. Its products are BaseKit Site (website builder),
  BaseKit Store (e-commerce) and BaseKit Bookings (appointment scheduling), deployed SaaS or
  on-premise across 60+ partners in 40 markets. Partners provision and manage end users through
  the BaseKit REST API, which exposes brands, users, packages, sites, domains, SSL certificates
  and webhook subscriptions. BaseKit was surfaced as a Seedcamp portfolio company and enriched
  from its public developer surface at apidocs.basekit.com.
